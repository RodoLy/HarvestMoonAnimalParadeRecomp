# Dolphin settings for Harvest Moon: Animal Parade (USA), RBIEE9.
# Ajustes de Dolphin para Harvest Moon: Animal Parade (USA), RBIEE9.
#
# The same settings that the Magical Melody recompilation (github.com/RodoLy/hmmmgc) starts its game
# with. scripts/build_and_run_linux.sh copies this file to the user folder (GameSettings/RBIEE9.ini),
# so the game starts with these settings without anyone editing a file. To change one only for
# yourself, write the same line in GameSettings/RBIEE9.ini inside your user folder.
# Not measured with this game yet.
#
# Los mismos ajustes con los que el recomp de Magical Melody arranca su juego.
# scripts/build_and_run_linux.sh copia este archivo a la carpeta del usuario
# (GameSettings/RBIEE9.ini), así que el juego arranca con estos ajustes sin que nadie edite un archivo.
# Para cambiar uno solo para ti, escribe la misma línea en GameSettings/RBIEE9.ini dentro de tu
# carpeta de usuario. Todavía no se ha medido con este juego.

[Core]
# The loop of the operating system's idle thread, `while (RunQueueBits == 0)`, found with
# tools/find_idle_loops.py: it sits right after OSSetCurrentContext(&IdleContext) and
# OSEnableInterrupts(), as in Magical Melody. The runner skips it instead of executing every turn.
# El bucle del hilo ocioso del sistema operativo, `while (RunQueueBits == 0)`, encontrado con
# tools/find_idle_loops.py: está justo después de OSSetCurrentContext(&IdleContext) y
# OSEnableInterrupts(), como en Magical Melody. El runner lo salta en vez de ejecutar cada vuelta.
StaticRecompIdlePC = 0x8025ACE0

# Do not emulate the slow drive of the console, so loads are shorter. False gives the original delays.
# No emular la lectura lenta del lector de la consola, así las cargas son más cortas. False da las
# esperas originales.
FastDiscSpeed = True
