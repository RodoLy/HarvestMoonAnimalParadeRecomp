<!DOCTYPE html>
<!-- The launcher's page. The parts that never change are here; launcher.js fills the rest
     (the tabs, the list, the message) and talks to the program around it (host/launcher.cpp). -->
<html>
<head>
<meta charset="utf-8">
<title>Harvest Moon: Animal Parade</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<div id="stage">

  <!-- Title bar: drag it to move the window. -->
  <div id="titlebar" class="abs" style="left:0;top:0;width:1280px;height:30px;box-sizing:border-box;background:#5e3712;display:flex;align-items:center;gap:8px;padding-left:14px;font-size:15px;letter-spacing:.06em;color:#fbeecb">
    <span style="width:10px;height:10px;border-radius:50%;background:#a8d830"></span>
    <span>Harvest Moon: Animal Parade — <span id="subtitle"></span></span>
    <div style="margin-left:auto;display:flex;gap:2px;padding-right:6px">
      <span id="minimize" class="titlebutton">–</span>
      <span id="close" class="titlebutton close">✕</span>
    </div>
  </div>
  <div class="abs" style="left:0;top:30px;width:1280px;height:2px;background:#a8d830"></div>

  <div class="abs" style="left:0;top:32px;width:1280px;height:720px;overflow:hidden;background:repeating-linear-gradient(180deg,#f8c832 0 90px,#f4bb22 90px 180px)">

    <!-- The picture behind everything: sky, sun rings and the fields. -->
    <div class="abs" style="left:12px;top:10px;width:1256px;height:700px;box-sizing:border-box;border-radius:46px;border:5px solid rgba(255,255,255,.55);overflow:hidden;background:#bfe6d2">
      <div class="abs" style="left:600px;top:0;width:660px;height:170px;background:#b9dcf0"></div>
      <div class="abs" style="left:380px;top:44px;width:1000px;height:1000px;box-sizing:border-box;border-radius:50%;border:12px solid #f4b63a"></div>
      <div class="abs" style="left:392px;top:56px;width:976px;height:976px;box-sizing:border-box;border-radius:50%;border:10px solid #f8e58a"></div>
      <div class="abs" style="left:0;top:590px;width:1256px;height:110px;display:flex">
        <div style="flex:2;background:#a9d86a"></div><div style="flex:3;background:#f3ec9a"></div><div style="flex:2;background:#9fd24a"></div><div style="flex:3;background:#f6e7a0"></div><div style="flex:2;background:#f3bd8c"></div>
      </div>
      <div class="abs" style="inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px)"></div>
    </div>

    <!-- The green board the list sits on. -->
    <div class="abs wheel" style="left:36px;top:96px;width:1208px;height:404px;box-sizing:border-box;border-radius:18px;background:#a8d830;border:4px solid #3f7d14;box-shadow:0 6px 0 rgba(74,44,18,.22)"></div>
    <div class="abs wheel" style="left:52px;top:112px;width:1176px;height:372px;box-sizing:border-box;border-radius:6px;background:#f7f3bf;border:3px solid #dff29a"></div>

    <div id="tabs" class="abs" style="right:64px;top:36px;height:64px;display:flex;align-items:flex-end;gap:8px"></div>

    <div id="paradeTop" class="abs" style="left:484px;top:-12px;width:256px;height:110px;overflow:hidden;pointer-events:none"></div>
    <div id="paradeBottom" class="abs" style="right:98px;top:456px;height:60px;padding:0 6px;overflow:hidden;display:flex;align-items:flex-end;pointer-events:none"></div>

    <div class="abs" style="left:70px;top:40px;height:64px;min-width:320px;box-sizing:border-box;border-radius:32px;background:#6a3c14;box-shadow:0 4px 0 rgba(58,31,8,.35),inset 0 0 0 2px rgba(255,255,255,.08);display:flex;align-items:center;padding:0 40px 0 84px;font-size:36px;letter-spacing:.04em;color:#fff;white-space:nowrap">
      <span id="tabAnimal" class="abs" style="left:-12px;top:-10px;width:78px;height:78px;box-sizing:border-box;border-radius:50%;background:#fff6d6;border:4px solid #fff;box-shadow:0 4px 0 rgba(58,31,8,.3);display:grid;place-items:center;overflow:hidden"></span>
      <span id="panelTitle"></span>
    </div>

    <!-- What the chosen tab shows. -->
    <div id="content"></div>

    <!-- The scroll bar. -->
    <div class="abs" style="left:1196px;top:124px;width:16px;text-align:center;font-size:12px;line-height:12px;color:#9a7a24">▲</div>
    <div class="abs" style="left:1196px;top:448px;width:16px;text-align:center;font-size:12px;line-height:12px;color:#9a7a24">▼</div>
    <div class="abs" style="left:1196px;top:140px;width:16px;height:304px;box-sizing:border-box;border-radius:8px;background:#efe2a0;border:2px solid #b9982e">
      <div id="handle" class="abs" style="left:1px;width:10px;height:34px;border-radius:6px;background:#7cc22e;top:1px"></div>
    </div>

    <!-- The message box. -->
    <div class="abs" style="left:36px;top:514px;width:1208px;height:104px;box-sizing:border-box;border-radius:16px;background:#a8d830;border:4px solid #3f7d14;box-shadow:0 6px 0 rgba(74,44,18,.22);padding:8px">
      <div id="message" style="width:100%;height:100%;box-sizing:border-box;border-radius:8px;background:#fbf8d2;border:3px solid #dff29a;display:flex;align-items:center;padding:0 30px;line-height:1.3;letter-spacing:.06em;color:#4a2c12;text-wrap:pretty;font-size:27px"></div>
    </div>

    <!-- Bottom row: launcher language, key hints, version. -->
    <div class="abs" style="left:48px;top:634px;width:1184px;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center">
      <div style="justify-self:start;display:flex;gap:4px;padding:4px;border-radius:22px;background:#5e3712">
        <div id="langEs" style="height:32px;padding:0 16px;border-radius:16px;display:grid;place-items:center;font-size:19px;letter-spacing:.05em;cursor:pointer">Español</div>
        <div id="langEn" style="height:32px;padding:0 16px;border-radius:16px;display:grid;place-items:center;font-size:19px;letter-spacing:.05em;cursor:pointer">English</div>
      </div>
      <div style="display:flex;align-items:center;gap:30px;font-size:22px;letter-spacing:.05em;color:#fff;-webkit-text-stroke:4px #5e3712;paint-order:stroke fill;white-space:nowrap">
        <div style="display:flex;align-items:center;gap:8px"><span class="key">▲▼</span><span id="hintMove"></span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="key">◀▶</span><span id="hintChange"></span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="key" style="border-radius:14px">Enter</span><span>OK</span></div>
        <div id="esc" style="display:flex;align-items:center;gap:8px;cursor:pointer"><span class="key">Esc</span><span id="escLabel"></span></div>
      </div>
      <div style="justify-self:end;height:40px;padding:0 18px;border-radius:20px;background:#5e3712;display:flex;align-items:center;gap:10px">
        <span id="versionLabel" style="font-size:19px;letter-spacing:.08em;color:#f3ddb0"></span>
        <span id="version" style="font:800 22px/1 'Baloo 2',sans-serif;color:#ffe36b;padding-top:2px"></span>
      </div>
    </div>
  </div>
</div>
<script src="animals.js"></script>
<script src="launcher.js"></script>
</body>
</html>
