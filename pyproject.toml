# Tool configuration only. Dependencies live in requirements*.txt because
# tools/ is a folder of scripts, not an installable package.

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, naming, bugbear, simplifications, pyupgrade
select = ["E", "W", "F", "I", "N", "B", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["analyze", "check_disc", "codewarrior", "disasm", "dol", "export_dolrecomp_map", "function_finder", "ppc", "ppc_encode", "ppc_mnemonics", "project", "sdk_names", "symbols", "synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
